apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: smoke-observability
spec:
  steps:
  # 1. Install zookeeper cluster
  - name: install zookeeper cluster
    try:
    - apply:
        file: ../../setup/zookeeper.yaml
    - assert:
        file: ../../setup/zookeeper-assert.yaml
    cleanup:
    - sleep:
        duration: 120s
    catch:
      - podLogs:
          name: zookeepercluster-sample-0
          container: server
      - describe:
          apiVersion: zookeeper.kubedoop.dev/v1alpha1
          kind: ZookeeperCluster
          name: zookeepercluster-sample
  # 2. Install Kafka cluster
  - name: install kafka cluster
    try:
      - apply:
          file: kafka.yaml
      - assert:
          file: kafka-assert.yaml
      - assert:
          timeout: 300s
          resource:
            kind: StatefulSet
            apiVersion: apps/v1
            metadata:
              name: kafkacluster-sample-broker-default
              namespace: ($namespace)
            status:
              readyReplicas: 3

  # 3. Verify metrics port connectivity and format
  - name: verify metrics connectivity
    try:
      - script:
          env:
          - name: NAMESPACE
            value: ($namespace)
          content: |
            #!/bin/bash
            set -ex

            # Get all Kafka broker pods
            echo "Namespace: $NAMESPACE"
            PODS=$(kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/component=broker,app.kubernetes.io/instance=kafkacluster-sample -o jsonpath='{.items[*].metadata.name}')
            echo "Found pods: $PODS"

            for POD in $PODS; do
              echo "Testing Pod: $POD"

              # Wait for the endpoint to serve broker metrics.
              #
              # The port-forward is re-established on every attempt on purpose.
              # All three pods reuse local port 9606, and a forward started before
              # the previous one released the port exits immediately - leaving
              # nothing listening, so retrying only curl can never recover. That is
              # what CI showed: 30 straight attempts of HTTP 000 against a pod whose
              # StatefulSet had already asserted readyReplicas: 3.
              #
              # Retrying the fetch still matters too: the JMX exporter answers with
              # jvm_ metrics before the broker registers its own MBeans, so an early
              # fetch can look healthy while carrying zero kafka_ metrics.
              TEMP_METRICS=$(mktemp)
              HTTP_CODE=000
              PF_PID=""
              for attempt in $(seq 1 30); do
                if [ -n "$PF_PID" ]; then
                  kill "$PF_PID" 2>/dev/null || true
                  wait "$PF_PID" 2>/dev/null || true
                fi
                kubectl port-forward -n "$NAMESPACE" "$POD" 9606:9606 > /dev/null 2>&1 &
                PF_PID=$!
                sleep 2

                # curl already prints 000 when it cannot connect; `|| true` only
                # keeps its non-zero exit from tripping `set -e`
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9606/metrics || true)
                if [ "$HTTP_CODE" = "200" ]; then
                  curl -s http://localhost:9606/metrics > "$TEMP_METRICS" 2>/dev/null
                  # grep -c exits 1 when nothing matches, so guard it under `set -e`
                  if [ "$(grep -c "^kafka_" "$TEMP_METRICS" || true)" -gt 0 ]; then
                    break
                  fi
                fi
                echo "  waiting for broker metrics on $POD (attempt $attempt, HTTP $HTTP_CODE)"
              done

              trap "kill $PF_PID 2>/dev/null || true" EXIT

              if [ "$HTTP_CODE" != "200" ]; then
                echo "ERROR: Failed to access metrics endpoint, HTTP code: $HTTP_CODE"
                rm -f "$TEMP_METRICS"
                kill $PF_PID 2>/dev/null || true
                exit 1
              fi

              echo "Fetching metrics from $POD..."

              # Verify Prometheus format
              if ! grep -q "# TYPE" "$TEMP_METRICS"; then
                echo "ERROR: Missing Prometheus format (# TYPE)"
                rm -f "$TEMP_METRICS"
                kill $PF_PID 2>/dev/null || true
                exit 1
              fi

              # Verify and count JVM metrics.
              # `|| true` is required: grep -c exits 1 on zero matches, which under
              # `set -e` would abort the script before the check below can report it.
              JVM_COUNT=$(grep -c "^jvm_" "$TEMP_METRICS" || true)
              if [ "$JVM_COUNT" -eq 0 ]; then
                echo "ERROR: Missing JVM metrics"
                rm -f "$TEMP_METRICS"
                kill $PF_PID 2>/dev/null || true
                exit 1
              fi
              echo "  ✓ Found $JVM_COUNT JVM metrics"

              # Verify and count Kafka-specific metrics (same grep -c caveat)
              KAFKA_COUNT=$(grep -c "^kafka_" "$TEMP_METRICS" || true)
              if [ "$KAFKA_COUNT" -gt 0 ]; then
                echo "  ✓ Found $KAFKA_COUNT Kafka metrics"
              else
                echo "  ⚠ No Kafka-specific metrics found"
              fi

              # Cleanup temp file
              rm -f "$TEMP_METRICS"

              echo "✓ Pod $POD metrics OK"

              # Cleanup
              kill $PF_PID 2>/dev/null || true
              sleep 1
            done

            echo "✓ All pods metrics verified"

  # 4. Install Prometheus
  - name: install prometheus
    try:
      - script:
          env:
            - name: NAMESPACE
              value: ($namespace)
          content: |
            #!/bin/bash
            set -ex

            echo "=== Environment Check ==="
            echo "NAMESPACE variable: '$NAMESPACE'"
            echo "NAMESPACE length: ${#NAMESPACE}"
            if [ -z "$NAMESPACE" ]; then
              echo "ERROR: NAMESPACE is empty!"
              exit 1
            fi

            helm repo add prometheus-community https://prometheus-community.github.io/helm-charts 2>/dev/null || true
            helm repo update

            # Self-heal from a previous interrupted run on a reused cluster: the chart's
            # cluster-scoped RBAC survives chainsaw's namespace deletion, and helm refuses
            # to adopt objects whose release-namespace annotation points at the dead
            # namespace. Harmless on a fresh (CI) cluster.
            kubectl delete clusterrole prometheus-server --ignore-not-found
            kubectl delete clusterrolebinding prometheus-server --ignore-not-found

            echo "=== Installing Prometheus ==="
            echo "Will install to namespace: $NAMESPACE"

            helm upgrade --install prometheus prometheus-community/prometheus \
              --version 25.3.1 \
              --namespace "$NAMESPACE" \
              --create-namespace \
              -f prometheus-values.yaml \
              --wait --timeout 5m
    cleanup:
      # Uninstall via helm BEFORE chainsaw deletes the namespace, so the chart's
      # cluster-scoped ClusterRole/ClusterRoleBinding are removed with the release
      # instead of leaking into the next run.
      - script:
          env:
            - name: NAMESPACE
              value: ($namespace)
          content: |
            helm uninstall prometheus --namespace "$NAMESPACE" --wait --timeout 2m || true

  # 5. Verify Prometheus targets
  - name: verify prometheus targets
    try:
      - script:
          env:
            - name: NAMESPACE
              value: ($namespace)
          content: |
            #!/bin/bash
            set -e

            # Wait for Prometheus server pod
            kubectl wait --for=condition=Ready pod -l app=prometheus,component=server -n "$NAMESPACE" --timeout=300s 2>/dev/null || true
            sleep 3

            # Port-forward
            kubectl port-forward -n "$NAMESPACE" svc/prometheus-server 9090:80 > /dev/null 2>&1 &
            PF_PID=$!
            sleep 2

            trap "kill $PF_PID 2>/dev/null || true" EXIT

            # Check targets (save to temp file to avoid set -x echoing full JSON)
            TARGETS_FILE=$(mktemp)
            curl -s http://localhost:9090/api/v1/targets > "$TARGETS_FILE" 2>/dev/null

            echo "=== Checking Prometheus Targets ==="

            # Check if we have any active targets
            ACTIVE=$(grep -o '"state":"up"' "$TARGETS_FILE" | wc -l)
            echo "Total active targets: $ACTIVE"

            if [ "$ACTIVE" -eq 0 ]; then
              echo "WARNING: No active targets found"
            fi

            # Check for Kafka targets
            echo "Looking for Kafka targets..."

            if grep -q "kafkacluster-sample" "$TARGETS_FILE"; then
              echo "✓ Found Kafka target"

              # Verify target is UP
              if grep "kafkacluster-sample" "$TARGETS_FILE" | grep -q '"health":"up"'; then
                echo "✓ Kafka target is UP"
              else
                echo "WARNING: Kafka target found but not UP"
              fi
            else
              echo "ERROR: Kafka target not found in Prometheus"
              echo "Available targets:"
              grep -o '"job":"[^"]*"' "$TARGETS_FILE" | sort | uniq
              rm -f "$TARGETS_FILE"
              exit 1
            fi

            rm -f "$TARGETS_FILE"

            echo "✓ Prometheus targets verification complete"
