apiVersion: kafka.kubedoop.dev/v1alpha1
kind: KafkaCluster
metadata:
  name: lifecycle
spec:
  image:
    productVersion: ($values.product_version)
  clusterConfig:
    zookeeperConfigMapName: kafka-znode
  brokers:
    roleconfig:
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
    roleGroups:
      primary:
        replicas: 1
      secondary:
        replicas: 1
---
apiVersion: zookeeper.kubedoop.dev/v1alpha1
kind: ZookeeperZnode
metadata:
  name: other-znode
spec:
  clusterRef:
    name: zookeepercluster-sample
---
apiVersion: kafka.kubedoop.dev/v1alpha1
kind: KafkaCluster
metadata:
  name: other
spec:
  image:
    productVersion: ($values.product_version)
  clusterConfig:
    zookeeperConfigMapName: other-znode
  brokers:
    roleGroups:
      default:
        replicas: 1
