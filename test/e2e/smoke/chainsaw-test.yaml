apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: simple-kafka
spec:
  bindings:
  steps:
  - name: install zookeeper cluster
    try:
    - apply:
        file: ../setup/zookeeper.yaml
    - assert:
        file: ../setup/zookeeper-assert.yaml
    cleanup:
    - sleep:
        duration: 30s
  - name: install kakfka cluster
    try:
    - apply:
        file: kafka.yaml
    - assert:
        file: kafka-assert.yaml
  - name: mutate cluster after install
    try:
    # Day-2 operations must propagate to existing resources (operator-go#526): scale the
    # role group down and push a config override, then assert both reach the live objects.
    - script:
        env:
          - name: NAMESPACE
            value: ($namespace)
        content: |
          kubectl -n $NAMESPACE patch kafkacluster kafkacluster-sample --type merge             -p '{"spec":{"brokers":{"roleGroups":{"default":{"replicas":2,"configOverrides":{"server.properties":{"log.retention.hours":"42"}}}}}}}'
    - assert:
        timeout: 180s
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: kafkacluster-sample-broker-default
          spec:
            replicas: 2
          status:
            readyReplicas: 2
    - script:
        env:
          - name: NAMESPACE
            value: ($namespace)
        content: |
          kubectl -n $NAMESPACE get cm kafkacluster-sample-broker-default             -o jsonpath='{.data.server\.properties}' | grep -q '^log.retention.hours=42$'
  - name: access kafka
    try:
      - apply:
          file: client-access-configmap.yaml
      - script:
          env:
            - name: NAMESPACE
              value: ($namespace)
          content: |
            export KAFKA_IMAGE=$(
            kubectl -n $NAMESPACE get statefulset kafkacluster-sample-broker-default \
            -o jsonpath='{.spec.template.spec.containers[?(.name=="kafka")].image}'
            )
            export KAFKA_DISCOVERY=$(
            kubectl -n $NAMESPACE get kafkaclusters.kafka.kubedoop.dev \
            -o jsonpath='{.items[0].metadata.name}'
            )
            echo "KAFKA_IMAGE=$KAFKA_IMAGE"
            echo "KAFKA_DISCOVERY=$KAFKA_DISCOVERY"

            envsubst '${KAFKA_IMAGE} ${KAFKA_DISCOVERY}' < client-access-pod.txt | kubectl -n $NAMESPACE apply -f -
      - assert:
          # the client polls for the created topic, so leave room for the poll
          # budget on top of the connection tests
          timeout: 300s
          resource:
            apiVersion: v1
            kind: Pod
            metadata:
              name: client-access
            status:
              phase: Succeeded
  catch:
    - podLogs:
        name: client-access
        container: client-access
    - describe:
        apiVersion: v1
        kind: Pod
        name: client-access
    - script:
        env:
          - name: NAMESPACE
            value: ($namespace)
        content: |
          kubectl -n $NAMESPACE get pod client-access -o yaml
          # broker-side context: restarts, OOMKills and probe failures explain
          # most client-access failures (kubedoop/kafka-operator#299)
          kubectl -n $NAMESPACE get pods -o wide
          kubectl -n $NAMESPACE get events --sort-by=.lastTimestamp | tail -n 40
