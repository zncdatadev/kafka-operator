                  operators are expected to set default values for all fields via
                  their webhook."
                properties:
                  custom:
                    description: |-
                      Custom is a fully qualified image reference (e.g. "my-registry.com/ns/product:3.4.1").
                      When set, Repo, ProductVersion and KubedoopVersion are ignored.
                    type: string
                  kubedoopVersion:
                    description: |-
                      KubedoopVersion is the version of the kubedoop operator stack (e.g. "0.2.0").
                      Used only when Custom is not set.
                    type: string
                  productVersion:
                    description: |-
                      ProductVersion is the version of the product to deploy (e.g. "3.4.1").
                      Used only when Custom is not set.
                    type: string
                  pullPolicy:
                    default: IfNotPresent
                    description: |-
                      PullPolicy defines the image pull policy for the container.
                      Defaults to IfNotPresent.
                    enum:
                    - Always
                    - Never
                    - IfNotPresent
                    type: string
                  pullSecretName:
                    description: |-
                      PullSecretName names a docker-registry Secret in the cluster CR's namespace, added to
                      .spec.imagePullSecrets of every pod the framework builds for this cluster.

                      It applies to whichever image path is taken, Custom included: a private registry is a
                      property of where the image lives, not of how its reference was assembled. It is also
                      deliberately NOT part of image resolution — a pull secret is still needed when the product
                      resolves its own images and the framework never builds a reference at all.

                      One name rather than a list, matching the field the ten product CRDs already declare. A
                      deployment needing several credentials merges them into one Secret, or adds the rest through
                      podOverrides, which is applied after this and therefore wins.
                    type: string
                  repo:
                    description: |-
                      Repo is the image repository (e.g. "quay.io/kubedoop").
                      Used only when Custom is not set.
                    type: string
                type: object
            required:
            - brokers
            - clusterConfig
            type: object
          status:
            description: KafkaClusterStatus defines the observed state of KafkaCluster.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the cluster state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed for this cluster.
                  It corresponds to the metadata generation of the CR.
                format: int64
                type: integer
              roleGroups:
                additionalProperties:
                  items:
                    type: string
                  type: array
                description: |-
                  RoleGroups tracks the actual deployed role groups.
                  Map key is the role name, value is the list of role group names.
                  This is used for orphaned resource cleanup.
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
